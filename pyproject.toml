[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arxiv-papers"
version = "0.1.0"
description = "A filesystem-backed arXiv paper library CLI for humans and agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Johannes R. Hübers"}]
dependencies = []

[project.scripts]
arxiv-papers = "arxiv_papers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arxiv_papers = ["_vendor/latexpand", "_vendor/LICENCE", "_vendor/README.md"]
